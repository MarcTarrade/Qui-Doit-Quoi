name: Spring API Build test

on:
  push:
    branches: [master]
  pull_request:
    branches: [master]

jobs:
  build-and-test:
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_DB: quidoitquoi
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d quidoitquoi"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    defaults:
      run:
        working-directory: api

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Java 25
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '25'
          cache: maven

      - name: Make Maven wrapper executable
        run: chmod +x mvnw

      - name: Build and test Spring API
        run: ./mvnw --batch-mode --no-transfer-progress clean verify
        env:
          POSTGRES_DB: quidoitquoi
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          SPRING_DOCKER_COMPOSE_LIFECYCLE_MANAGEMENT: none
