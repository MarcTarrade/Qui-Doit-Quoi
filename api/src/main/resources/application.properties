spring.datasource.url=jdbc:postgresql://localhost:5432/${POSTGRES_DB:quidoitquoi}
spring.datasource.username=${POSTGRES_USER:postgres}
spring.datasource.password=${POSTGRES_PASSWORD:postgres}
spring.datasource.driver-class-name=org.postgresql.Driver

# JPA settings (optional)
spring.jpa.hibernate.ddl-auto=update

# Show JDBC logs
logging.level.org.springframework.jdbc=INFO
spring.application.name=api
spring.docker.compose.file=../docker-compose.yaml
security.jwt.secret=${JWT_SECRET:change-this-development-secret-to-a-long-random-value}
security.jwt.cookie.secure=${JWT_COOKIE_SECURE:true}
security.jwt.cookie.same-site=${JWT_COOKIE_SAME_SITE:Lax}
app.cors.allowed-origins=${CORS_ALLOWED_ORIGINS:http://localhost:3001}
springdoc.swagger-ui.persistAuthorization=true
